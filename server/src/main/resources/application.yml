server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: amms-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:amms}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    enabled: true
  jooq:
    sql-dialect: POSTGRES
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        write-dates-as-timestamps: false
        adjust-dates-to-context-time-zone: false
        write-dates-with-context-time-zone: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

amms:
  cors:
    allowed-origins: ${AMMS_CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-dev-secret-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  forms:
    # ADR-002: mongo for dynamic forms; postgres JSONB is test/offline fallback only
    store: ${AMMS_FORMS_STORE:mongo}
  attachments:
    store: ${AMMS_ATTACHMENTS_STORE:filesystem}
    dir: ${AMMS_ATTACHMENTS_DIR:.data/attachments}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:amms}
  seed:
    enabled: ${AMMS_SEED_ENABLED:true}
    password: ${SEED_PASSWORD:Passw0rd!}
  workflows-dir: ${AMMS_WORKFLOWS_DIR:../docs/workflows}

logging:
  level:
    com.hal.amms: INFO
    org.springframework.security: WARN
