spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:amms}
    username: ${POSTGRES_USER:amms}
    password: ${POSTGRES_PASSWORD:amms_dev}
  flyway:
    enabled: true

amms:
  seed:
    enabled: true
  workflows-dir: classpath:workflows
  jwt:
    secret: test-secret-key-at-least-32-characters-long
  attachments:
    dir: target/test-attachments
