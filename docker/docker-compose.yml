services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amms}
      POSTGRES_USER: ${POSTGRES_USER:-amms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amms_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    env_file:
      - ../config/.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres
      MONGODB_URI: mongodb://mongo:27017/amms
      AMMS_FORMS_STORE: mongo
      AMMS_WORKFLOWS_DIR: /app/workflows
    ports:
      - "${SERVER_PORT:-18080}:18080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - ../docs/workflows:/app/workflows:ro
      - ../.data/attachments:/app/.data/attachments

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    ports:
      - "${UI_PORT:-15173}:80"
    depends_on:
      - server
    profiles:
      - ui

volumes:
  pgdata:
  mongodata:
  miniodata:
